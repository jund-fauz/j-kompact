name: Bug report
description: Something in j-kompact doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below so it can be reproduced quickly.
        You can write in English or Bahasa Indonesia.

  - type: input
    id: version
    attributes:
      label: Version
      description: The j-kompact version you are using (see `jsr.json`, `deno.json`, or `package.json` in your project).
      placeholder: 0.3.2
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Where does the bug happen?
      multiple: true
      options:
        - Node.js
        - Bun
        - Deno
        - Google Apps Script
        - Browser
        - Other
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: Node.js 24.1.0
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Code to reproduce
      description: The smallest code snippet that shows the bug.
      render: ts
      placeholder: |
        import { initArray } from '@jund-fauz/j-kompact'

        initArray([1, 2, 3]).get(1, 2)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the full error message and stack trace if there is one.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this bug has not been reported yet.
          required: true
        - label: I can reproduce this bug with the latest version on JSR.
          required: false
